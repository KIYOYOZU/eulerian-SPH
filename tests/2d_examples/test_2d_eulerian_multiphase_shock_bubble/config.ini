# 2D shock-bubble interaction (gas bubble in water, left-running water shock).
# Reference window 0.027 x 0.012 m; the right reservoir is extended to x_right
# so the right-wall rarefaction stays outside the window during [0, end_time]
# (equivalent to a transmissive right boundary within the window).
[geometry]
dp = 1.0e-4
L = 0.027              # reference window length (figure)
H = 0.012              # box height
x_right = 0.05         # extended right reservoir end (>= L)
bubble_x = 0.012
bubble_y = 0.006
bubble_r = 0.003
x_shock = 0.0201       # initial shock plane (post-shock on its right)
[material]
# phase 1 = gas (bubble), phase 2 = water
gamma1 = 1.4
p_inf1 = 0.0
gamma2 = 4.4
p_inf2 = 6.0e8
[ic]
rho_postshock = 1323.65
p_postshock = 1.9e9
u_postshock = -681.58
rho_preshock = 1000.0
p_preshock = 1.0e5
rho_bubble = 1.0
p_bubble = 1.0e5
[simulation]
end_time = 6.0e-6
output_interval = 0.25e-6
acoustic_cfl = 0.1
riemann_order = 2
muscl_limiter = minmod
muscl_reconstruct = vel_p
