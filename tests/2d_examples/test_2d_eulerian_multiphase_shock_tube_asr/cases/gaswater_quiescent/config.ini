# Static graded-lattice well-balancing gate for the zeroth-order gradient
# correction: uniform pressure, u=0, gas-water alpha jump at x_interface.
# steady_correction is OFF so that only the kernel-gradient correction is
# active -- a quiescent state must then stay at rest to machine precision.
[geometry]
dp = 0.0025
L = 1.0
x_interface = 0.7
[material]
gamma1 = 1.4
p_inf1 = 0.0
gamma2 = 4.4
p_inf2 = 6.0e8
[ic]
preset = quiescent
rho_L = 1.4
p_L = 1.0e6
u_L = 0.0
alpha_L = 1.0
rho_R = 1000.0
p_R = 1.0e6
u_R = 0.0
alpha_R = 0.0
[simulation]
end_time = 2.0e-5
output_interval = 1.0e-5
acoustic_cfl = 0.1
screen_output_interval = 100
[asr]
ds_max_factor = 4.0
band_coef = 1.4142135623730951
band_width_factor = 5.0
h_spacing_ratio = 1.5
initial_banding = on
adapt_h = off
adapt_split_merge = off
adapt_bands = off
kernel = hyperbolic
shepard_filter = off
adapt_interval = 5
buffer_growth = 15.5
steady_correction = off
check_symmetry = on
print_moment = on
