# 3D Eulerian weakly-compressible flow around a spanwise-periodic cylinder.
# Smoke settings keep the local particle count below the large-case limit.

[geometry]
dl = 2.0
dh = 1.0
dw = 0.25
global_resolution = 0.04
sponge_width_factor = 3.0
cylinder_center_x = 0.5
cylinder_center_y = 0.5
cylinder_radius = 0.10

[physical]
rho0_f = 1.0
u_f = 1.0
sound_speed_factor = 12.0
re = 100.0
outlet_pressure = 0.0

[simulation]
end_time = 50.0
output_interval = 50
screen_output_interval = 1000
acoustic_cfl = 0.25
boundary_n_layers = 3
enable_restart = true
restart_step = 0
restart_output_factor = 10
restart_keep_last_n = 3

[validation]
smoke_min_steps = 50
cl_cd_epsilon = 1.0e-12

# -----------------------------------------------------------------------------
# Post-processing
# -----------------------------------------------------------------------------
# These keys are read by postprocess_cylinder_flow_field.py and
# postprocess_cylinder_cl_cd_curve.py. Leave a key blank to fall back to
# the script's built-in default.
[postprocess]
# Per-VTP rendering mode: "3d-cloud" (full 3D scatter) or "xy-slice"
# (mid-span XY slice, much cheaper for smoke checks).
flow_field_mode = 3d-cloud
# Cylinder-case force CSV produced by postprocess_cl_cd.py.
cl_cd_csv = results/cylinder_3d_cl_cd.csv
# Trailing moving-average window (seconds) for Cd/Cl curve smoothing.
# Set to 0 to disable smoothing.
cd_cl_smooth_window = 0.0
# Cap on rendered fluid particles per VTP frame (uniform random downsample).
flow_field_max_points = 0
# Skip the initial condition frame (ite_0000000000.vtp) by default;
# set to true to include it.
flow_field_skip_initial = true
# XY-slice half-thickness, expressed in multiples of dp.
xy_slice_half_width_dp = 0.5
