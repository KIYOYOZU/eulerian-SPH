# =============================================================================
# Rotor 67 — domain-STL 初始化烟测配置（Euler + 旋转参考系 + hub/shroud/blade 壁带 + 黏性）
# =============================================================================
# 几何来源：docu/R67_CFX/rotor67_domain.stl 的 named solid surfaces。
# C++ runtime 不再读取旧 STEP passage mesh、blade-wall mesh、profile/reload artifacts。
# 粒子位置使用标准笛卡尔 (x,y,z)，转轴 Z，扇形 theta in [0, delta_theta]。
# 代码 vel_ 字段统一存旋转系相对速度 w = (Omega*y, -Omega*x, v_z)。
# =============================================================================

[case]
profile = smoke                 # smoke | literature_clean；默认算例不声称文献级复现。

[physical]
# 理想气体（与 shock_tube 一致：CompressibleFluid(rho0, gamma)）。
rho0_f = 1.225                # 入口静密度参考 (kg/m^3), 海平面空气。
gamma = 1.4                   # 比热比。
# 入口轴向相对速度 v_x（无预旋工况：绝对切向 = 0 → 相对切向 = -Omega*r）。
# 跨声速设计点入口相对马赫约 0.65–1.42，这里取中径相对马赫 ~0.8 烟测。
inlet_axial_velocity = 100.0  # m/s, 入口轴向相对速度 v_x。
# 入口总压 / 总温（用于等熵换算入口静压，初始场用）。
inlet_total_pressure = 101325.0   # Pa.
inlet_total_temperature = 288.15   # K.
# 气体常数（用于 T -> p 等熵换算与声速 c=sqrt(gamma*R*T)）。
gas_constant = 287.05          # J/(kg.K), 干空气。

[rotor]
# 转子几何与工况（当前 smoke/历史 Rot.inf 参数；不作为 literature design rpm）。
n_blades = 22                 # 叶片数。
rpm = 16032                   # 转速 (rev/min), smoke 值；文献 clean 模板使用 16043。
# Omega = 2*pi*rpm/60, 由 data.hpp 解析时计算；这里也可直接覆盖。
# omega_rad_s = 1678.87       # 留空则由 rpm 自动计算。
# 全尺度几何（不再缩放）：hub/shroud 半径仅作 config 校验与 system bounds 参考，
# 真实 r(z) 曲线由 [meridional] 的 .curve 文件全尺度直接读入。
hub_radius = 0.089            # m, hub 名义半径（全尺度，参考用）。
shroud_radius = 0.257         # m, shroud 名义半径（全尺度，参考用）。
# 叶片弦向最大宽度（全尺度，参考用）。
blade_chord_max = 0.090       # m, 叶片弦向最大宽度（全尺度）。
# 扇形几何（单通道）。
theta0 = 0.0                  # rad, 扇形起始角。
# delta_theta = 2*pi/22 自动计算，也可覆盖。
# 几何缩比已废弃（保留字段仅向后兼容，C++ 端不再使用）。
geometry_scale = 1.0

[geometry]
domain_stl = docu/R67_CFX/rotor67_domain.stl
z_in = -0.0400000574          # m, domain STL inlet z bound.
z_out = 0.1303002690          # m, domain STL outlet z bound.
global_resolution = 0.002     # m, 粒子间距 dp（初始化烟测 2 mm，改善薄叶片 wall 采样）。
particle_boundary_offset = 0.5 # fluid/wall 首层中心距 physical surface 的 dp 倍数。
sponge_width_factor = 5.0     # sponge 厚度 (dp 倍)，入口/出口外延。
z_buffer_factor = 4.0         # hub/casing 壁面 z 外延 (dp 倍)。

[inlet]
profile = annular_swirl       # clean 入口相对速度 w=(Omega*y,-Omega*x,v_z)。
case_type = clean             # clean | pressure_distortion | swirl_distortion | combined。
swirl_axis = Z                # 转轴。
flow_direction = axial        # clean inlet baseline：绝对系轴向来流。
swirl_type = none             # none | co | counter；绝对系 bulk swirl 预旋。
swirl_angle_deg = 0.0         # clean inlet baseline：无预旋。
total_pressure_profile = uniform  # uniform | tip_radial | hub_radial。
distortion_intensity = 0.0    # DI = (P0c-P0d)/P0c；允许 0, 0.05, 0.10。

[outlet]
back_pressure = 130000.0      # Pa, 出口背压（> 入口静压，模拟压气机压比）。

[wall]
casing_motion = stationary_absolute  # casing 绝对系静止，旋转系速度为 -Omega x r。
wall_layers = 3                      # hub/casing wall shell 总厚度为 3dp。

[simulation]
end_time = 0.00001            # s, 初始化短烟测；长时稳定性调参不属于本阶段。
output_interval = 20          # VTP 输出帧间隔（声学步数）。
screen_output_interval = 20   # 屏幕打印间隔。
allow_high_mach = true        # 跨声速工况，跳过低 Mach 守卫。
# c_f 人工声速不再使用（强可压走真实 EOS 声速）；保留键仅作记录。
c_f = 0.0

[boundary]
boundary_n_layers = 3         # 边界层厚度 (dp 倍)，face 分类用。
inlet_outlet_tolerance_factor = 3.0
periodic_tolerance_factor = 1.5
wall_near_tolerance_factor = 1.0

[viscosity]
# Phase B 黏性（Pa·s）。设 0 退回 Phase A 无黏 Euler。
# 海平面空气动力黏度 mu ≈ 1.8e-5；此处用层流参考值，无湍流模型。
dynamic_viscosity = 1.8e-5

[meridional]
# r(z) 子午面曲线（CFX-BladeGen 导出的全尺度 .curve 文件，单位 m）。
# C++ 端全尺度直接读入，不再施加 1/geometry_scale 缩比。
# 路径相对于 config.ini 所在目录解析。
# 文件格式：3 列空格分隔（index, r, z），共 1200 点。
hub_curve    = docu/R67_CFX/Rot_Hub.curve
shroud_curve = docu/R67_CFX/Rot_Shd.curve

[validation]
mass_flux_imbalance_tol = 0.05  # 入口/出口质量流量偏差容差（趋势性）。
pressure_ratio_min = 1.2        # 压比下限（趋势性）。
pressure_ratio_max = 2.0        # 压比上限（趋势性）。
