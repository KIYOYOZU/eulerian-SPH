# ============================================================================
# 3D Eulerian weakly-compressible laminar channel flow configuration
# ============================================================================
# Smoke-test case: small particle count (< ~50k), low Mach.
# Flow: streamwise x, wall-normal y, spanwise z (periodic).
# Inlet: parabolic profile u_x(y) = U_max * 4 * eta * (1 - eta), eta = y / DH,
#        U_max = 1.5 * u_bulk, so the bulk average equals u_bulk.
# Comment chars: '#' and ';' (both supported by the parser).
# ============================================================================

[physical]
# Fluid properties
rho0_f = 1.0       # Reference density (kg/m^3)
u_bulk = 1.0       # Bulk (volume-averaged) velocity (m/s)
c_f = 20.0         # Artificial sound speed (m/s), >= 10 * 1.5 * u_bulk = 15
nu = 0.01          # Kinematic viscosity (m^2/s), Re = u_bulk * DH / nu = 100

[geometry]
# Domain size (m)
DL = 2.0           # Streamwise length
DH = 1.0           # Wall-normal height
DW = 1.0           # Spanwise width
global_resolution = 0.05  # Particle spacing dp (m), 20 particles per DH
sponge_width_factor = 5.0 # Sponge thickness in dp units (x-direction inlet/outlet), aligned with 2D LG; DL_sponge = 5*dp = 0.25
z_buffer_factor = 4.0      # z-direction wall body buffer extension in dp units (周期方向，wall z 外延消除端面退化); DZ_buffer = 4*dp = 0.2

[inlet]
profile = parabolic       # Only "parabolic" is supported
relaxation_rate = 1.0     # Reserved for blending (1.0 = full inlet value)

[simulation]
end_time = 10.0           # End simulation time (s)
acoustic_cfl = 0.25       # Acoustic CFL
output_interval = 20      # VTP output interval (reload steps)
screen_output_interval = 10  # Screen print interval (iterations)
allow_high_mach = false   # Enforce the low-Mach guard (c_f >= 10 * 1.5 * u_bulk)

[boundary]
outlet_pressure_mode = zero_gradient  # Only "zero_gradient" is supported
boundary_n_layers = 3    # Ghost-layer thickness (in dp) for face classification

[validation]
inlet_profile_l2_tol = 0.05  # L2 tolerance for inlet profile check
wall_slip_tol = 0.01         # Tolerance for wall no-slip check
