# 3D Eulerian fully-compressible ideal-gas flow around a spanwise-periodic
# cylinder at Ma = 0.3, Re = 100.
#
# The freestream is fully determined by gamma / rho_inf / c_inf / mach_inf / re.
# Everything else (u_inf, p_inf, total energy density, mu) is derived by
# deriveAndValidate(); do not add independent u_inf / p_inf / mu keys.
#
# gamma, rho_inf and c_inf are locked to 1.4 / 1.0 / 1.0 because the shared
# compressible integration hardcodes CompressibleFluid(1.4) and
# CompressibleFluid::ReferenceDensity() / ReferenceSoundSpeed() both return 1.0.
#
# Smoke settings keep the local particle count below the large-case limit.

[geometry]
dl = 2.0
dh = 1.0
# The physical span is kept independent of dp. The cylinder wall uses a
# periodic z lattice with an integer number of layers and its own exact dz.
dw = 0.25
global_resolution = 0.02
cylinder_center_x = 0.5
cylinder_center_y = 0.5
cylinder_radius = 0.10

[physical]
gamma = 1.4
rho_inf = 1.0
c_inf = 1.0
mach_inf = 0.3
re = 100.0

[simulation]
# Ma=0.3 production run extended to 80 s: the Re=100 wake needs the longer
# horizon for the shedding transient to fully develop (50 s covered ~75
# convective times; 80 s covers ~120). The A3 limiter + A4 positivity floor
# stay enabled; at Ma=0.3 the floor never fires and the limiter is
# near-transparent at subsonic contacts.
end_time = 80.0
output_interval = 50
screen_output_interval = 1000
# In the historical Ma=0.3 CFL=0.1/0.05 A/B, both settings failed at the same
# physical time. Retain CFL=0.1 here; the Ma=2 run is a new operating point.
acoustic_cfl = 0.1
boundary_n_layers = 3
ghost_reserve_factor = 0.5
enable_restart = false
restart_step = 0
restart_output_factor = 10
restart_keep_last_n = 3

[boundary]
# Restore the original mixed-boundary experiment: the x faces retain their
# far-field ghosts while the y faces are physical walls.
x_boundary = farfield
# The parser default is "farfield" when this key is absent; this local
# verification switches both y faces to static no-slip wall-contact boundaries.
y_boundary = wall

[validation]
y_wall_first_order_reconstruction = false
y_wall_first_order_band_dp = 2.6
outlet_y_wall_corner_first_order_reconstruction = false
outlet_corner_first_order_band_dp = 2.6
wall_contact_first_order_reconstruction = true
wall_flux_probe_interval = 50
# A3 stability A/B (findings.md "Mach 2 vs 2D"): route the MUSCL-HLLC bridge
# through the dissipation-limited HLLC solver with Roe-averaged widened wave
# speeds. The plain Davis-speed HLLC upwinds supersonic normal flow at the
# mirrored wall ghosts, so at Ma=2 the rear cylinder face leaked mass/energy
# through the wall from t=0 (wall-flux gate net=gross=0.508, rel=1.0) and the
# bow-shock MUSCL undershoot was unchecked. Parameter 5.0 matches the working
# 2D supersonic case (integration default). Set false to recover the failing
# baseline.
# 2026-08-02 Ma=0.3 A/B: limiter DISABLED here. The limiter scales the p_star
# dissipation term by SMIN(5*SMAX((ul-ur)/clr,0),1), which is << 1 in smooth
# subsonic flow, so p_star collapses to a plain central average and the
# near-y-wall numerical dissipation (the dominant effective viscosity at
# Re=100) vanishes -- the rerun showed clearly elevated y-wall velocities vs
# d55d9276. Keep true only for the Ma=2 supersonic operating point.
muscl_hllc_dissipation_limiter = false
muscl_hllc_limiter_parameter = 5.0
# Positivity floor (Zhang-Shu style), the final Ma=2 ingredient. The A3
# limited HLLC still leaves isolated bow-shock MUSCL undershoot cells at
# p ~ -0.1*p_inf (bounded, non-propagating; see findings.md "A3 扩展验证").
# The floor clamps rho/p at factor x freestream with a consistent energy
# rewrite once per step, keeping the strict positivity gates green. The
# correction is visible in the conservation report's ungated imbalance
# print. Set false to recover the A3-only behaviour.
positivity_floor = true
positivity_floor_factor = 1.0e-2
smoke_min_steps = 50
# Relative streamwise velocity perturbation in the initial condition.
#
# 0 makes the uniform-flow zero-residual test runnable, but it also leaves the
# whole setup exactly symmetric about y = DH/2: the dp=0.04 / t=49.3 run stayed
# on the symmetric steady branch with Cl ~ 5e-7 and no vortex shedding at all,
# even after 74 convective times. A finite value breaks that symmetry so the
# Re=100 wake can go unstable. Set back to 0 for the zero-residual test.
# Retain the original symmetry-breaking perturbation; its Ma=0.3 mixed-boundary
# A/B evidence is historical and is not claimed to predict the Ma=2 wake.
# 2026-08-02 A1 result: noise=0 still dt-collapsed at t=0.2127 s / step 789
# (baseline noise=0.1: t=0.1996 s / step 733) -- the seed only advances the
# failure slightly, the scheme itself is the trigger, so the perturbation is
# restored for the Re=100 wake.
velocity_noise_amplitude = 0.1
mass_drift_tolerance = 1.0e-4
energy_drift_tolerance = 1.0e-3
# Wall-flux imbalance |net| / |gross| allowed on the curved cylinder surface.
# This is a relative criterion on purpose: a lattice-generated cylinder at
# D/dp = 5 carries an O(dp) per-owner residual, so the plan's absolute
# "net penetration < 1e-12" only holds for a flat wall under normal incidence
# and belongs in a unit-test fixture, not here.
wall_flux_relative_tolerance = 1.0e-2
# Absolute floor for the wall net flux, as a fraction of the reference mass flow
# rho_inf*u_inf*D*DW. On a uniform freestream the mirrored ghost state cancels the
# wall flux down to machine precision, so net and gross are both ~1e-18 and their
# ratio is rounding noise; below this floor the wall is provably tight in absolute
# terms and the relative criterion is bypassed.
wall_flux_absolute_floor_factor = 1.0e-10

# -----------------------------------------------------------------------------
# Post-processing
# -----------------------------------------------------------------------------
# These keys are read by postprocess_cylinder_flow_field.py and
# postprocess_cylinder_cl_cd_curve.py. Leave a key blank to fall back to
# the script's built-in default.
[postprocess]
# Per-VTP rendering mode: "3d-cloud" (full 3D particle cloud),
# "grid-slice" (native fixed-particle XY cells), or "xy-slice" (XY scatter).
flow_field_mode = 3d-cloud
# Cylinder-case force CSV produced by postprocess_cl_cd.py.
cl_cd_csv = results/cylinder_3d_cl_cd.csv
# Trailing moving-average window (seconds) for Cd/Cl curve smoothing.
# Set to 0 to disable smoothing.
cd_cl_smooth_window = 0.0
# Cap on rendered fluid particles per VTP frame (uniform random downsample).
flow_field_max_points = 0
# Skip the initial condition frame (ite_0000000000.vtp) by default;
# set to true to include it.
flow_field_skip_initial = true
# XY-slice half-thickness, expressed in multiples of dp.
xy_slice_half_width_dp = 0.5
